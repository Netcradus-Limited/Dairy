<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Sawariya Dairy">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Preconnect to Google Fonts & CanvasKit CDN for accelerated network handshakes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>

  <title>Sawariya Dairy</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Mobile Video Autoplay & PlaysInline Helper -->
  <script>
    function setupVideoElement(v) {
      if (!v) return;
      v.muted = true;
      v.setAttribute('muted', '');
      v.setAttribute('playsinline', '');
      v.setAttribute('webkit-playsinline', '');
      v.setAttribute('autoplay', '');
      v.setAttribute('loop', '');
    }

    // Auto-setup any video added to DOM
    var observer = new MutationObserver(function(mutations) {
      mutations.forEach(function(mutation) {
        mutation.addedNodes.forEach(function(node) {
          if (node.tagName === 'VIDEO') {
            setupVideoElement(node);
            node.play().catch(function(){});
          } else if (node.querySelectorAll) {
            var videos = node.querySelectorAll('video');
            videos.forEach(function(v) {
              setupVideoElement(v);
              v.play().catch(function(){});
            });
          }
        });
      });
    });

    if (document.body) {
      observer.observe(document.body, { childList: true, subtree: true });
    } else {
      document.addEventListener('DOMContentLoaded', function() {
        observer.observe(document.body, { childList: true, subtree: true });
      });
    }

    // Resume muted videos on first user touch / pointer interaction
    function onFirstUserGesture() {
      var videos = document.querySelectorAll('video');
      videos.forEach(function(v) {
        setupVideoElement(v);
        if (v.paused) {
          v.play().catch(function(){});
        }
      });
    }

    window.addEventListener('touchstart', onFirstUserGesture, { passive: true });
    window.addEventListener('pointerdown', onFirstUserGesture, { passive: true });
    window.addEventListener('click', onFirstUserGesture, { passive: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
